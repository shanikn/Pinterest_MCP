[project]
name = "pinterest-mcp"
version = "0.1.0"
description = "MCP server for reading my own Pinterest boards and Pins"
readme = "README.md"
authors = [
    { name = "Shani Knobel", email = "shani.knobel@post.runi.ac.il" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pinterest-mcp = "pinterest_mcp:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]